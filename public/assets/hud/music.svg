<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Tuning Pegs -->
    <path d="M8 2.5v2M10.7 2.5v2M13.3 2.5v2M16 2.5v2" stroke="#dfb45f" stroke-width="1.2"/>
    <!-- Crossbar / Yoke -->
    <path d="M3.5 5h17" stroke="#18110c" stroke-width="2.2"/>
    <path d="M4 5h16" stroke="#986a3e" stroke-width="1.2"/>
    <path d="M4 4.5h16" stroke="#fbe6a8" stroke-width="0.6"/>
    <!-- Curved Lyre Arms (Carved Wood Horns) -->
    <path d="M5 5c0 4.5 1.5 8.5 3 11h8c1.5-2.5 3-6.5 3-11" stroke="#18110c" stroke-width="2.8"/>
    <path d="M5 5c0 4.5 1.5 8.5 3 11h8c1.5-2.5 3-6.5 3-11" stroke="#684528" stroke-width="1.6"/>
    <!-- Woodcut Hatching on Arms -->
    <path d="M4.5 7.5l1.5 0.5M4.8 10l1.5 0.5M5.5 12.5l1.5 0.5M19.5 7.5l-1.5 0.5M19.2 10l-1.5 0.5M18.5 12.5l-1.5 0.5" stroke="#18110c" stroke-width="0.6"/>
    <!-- Soundbox Base -->
    <path d="M7 16h10l-1.5 6.5h-7L7 16z" fill="#4a301a" stroke="#18110c" stroke-width="1.3"/>
    <path d="M7 16h10" stroke="#dfb45f" stroke-width="0.9"/>
    <!-- Rosette / Sound Hole -->
    <circle cx="12" cy="19.2" r="1.8" fill="#18110c" stroke="#dfb45f" stroke-width="0.7"/>
    <circle cx="12" cy="19.2" r="0.7" fill="#fbe6a8"/>
    <!-- 4 Celestial Strings (Taut & Radiant) -->
    <line x1="8" y1="5.5" x2="8.8" y2="16" stroke="#dfb45f" stroke-width="0.9"/>
    <line x1="10.7" y1="5.5" x2="11" y2="16" stroke="#fbe6a8" stroke-width="0.9"/>
    <line x1="13.3" y1="5.5" x2="13" y2="16" stroke="#fbe6a8" stroke-width="0.9"/>
    <line x1="16" y1="5.5" x2="15.2" y2="16" stroke="#dfb45f" stroke-width="0.9"/>
    <!-- Tailpiece Bracket -->
    <path d="M8.5 22.5h7" stroke="#18110c" stroke-width="1.4"/>
  </g>
</svg>
