<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Cardinal Chiseled Rays -->
    <path d="M12 1v3.5M12 19.5V23M1 12h3.5M19.5 12H23" stroke="#eed182" stroke-width="1.4"/>
    <path d="M4.2 4.2l2.5 2.5M17.3 17.3l2.5 2.5M4.2 19.8l2.5-2.5M17.3 6.7l2.5-2.5" stroke="#b28038" stroke-width="1.1"/>
    <!-- Outer Stippled Astronomical Ring -->
    <circle cx="12" cy="12" r="10" stroke="#1c120c" stroke-width="1.3"/>
    <circle cx="12" cy="12" r="8.7" stroke="#dfb05a" stroke-width="0.8" stroke-dasharray="0.8 1.2"/>
    <circle cx="12" cy="12" r="7.6" stroke="#1c120c" stroke-width="0.7"/>
    <!-- Armillary Inclined Meridian Bands (Robert Fludd) -->
    <ellipse cx="12" cy="12" rx="7.2" ry="2.8" stroke="#1c120c" stroke-width="1.4" transform="rotate(-35 12 12)"/>
    <ellipse cx="12" cy="12" rx="7.2" ry="2.8" stroke="#f6d588" stroke-width="0.8" transform="rotate(-35 12 12)"/>
    <ellipse cx="12" cy="12" rx="7.2" ry="2.8" stroke="#1c120c" stroke-width="1.4" transform="rotate(35 12 12)"/>
    <ellipse cx="12" cy="12" rx="7.2" ry="2.8" stroke="#caa04a" stroke-width="0.8" transform="rotate(35 12 12)"/>
    <!-- Center Celestial Eye & Radiant Core -->
    <circle cx="12" cy="12" r="4.3" fill="#1c120c" stroke="#b28038" stroke-width="0.8"/>
    <circle cx="12" cy="12" r="3.3" fill="#caa04a"/>
    <circle cx="12" cy="12" r="2.1" fill="#fff5d4"/>
    <circle cx="12" cy="12" r="1.1" fill="#1c120c"/>
    <!-- Engraved Cross-hatching Accents -->
    <path d="M12 9v1M12 14v1M9 12h1M14 12h1" stroke="#fff5d4" stroke-width="0.6"/>
  </g>
</svg>
