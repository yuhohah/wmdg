<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Suspension Throne & Ring -->
    <circle cx="12" cy="3" r="2.2" stroke="#18110c" stroke-width="1.3"/>
    <circle cx="12" cy="3" r="1.3" stroke="#f5d57b" stroke-width="0.8"/>
    <path d="M10 4.8l2-0.8 2 0.8" stroke="#18110c" stroke-width="1.2"/>
    <!-- Outer Astrolabe Limb / Mater -->
    <circle cx="12" cy="13.5" r="9.2" fill="#46311d" stroke="#18110c" stroke-width="1.3"/>
    <circle cx="12" cy="13.5" r="8.2" stroke="#f5d57b" stroke-width="0.8" stroke-dasharray="1 1.2"/>
    <circle cx="12" cy="13.5" r="7.2" fill="#18110c" stroke="#c8983e" stroke-width="0.8"/>
    <!-- Inner Rete (Pierced Celestial Openwork & Star Pointers) -->
    <!-- Ecliptic Circle (Eccentric) -->
    <circle cx="12" cy="12.2" r="4.2" stroke="#c8983e" stroke-width="1"/>
    <circle cx="12" cy="12.2" r="4.2" stroke="#f5d57b" stroke-width="0.6" stroke-dasharray="1.2 1.5"/>
    <!-- Star Pointers (Flame-like curved brass pointers) -->
    <path d="M12 6.5l-0.8 1.8 1.6 0zM17.5 10l-1.8 0.6 0.8 1.4zM6.5 10l1.8 0.6-0.8 1.4z" fill="#f5d57b" stroke="#18110c" stroke-width="0.6"/>
    <!-- Central Alidade (Rotating Sighting Rule) -->
    <path d="M5.5 20l13-13" stroke="#18110c" stroke-width="2.2"/>
    <path d="M5.5 20l13-13" stroke="#f5d57b" stroke-width="1.1"/>
    <!-- Sighting pinnules (folding sights on alidade) -->
    <line x1="7.5" y1="16.5" x2="9" y2="18" stroke="#18110c" stroke-width="1"/>
    <line x1="15" y1="9" x2="16.5" y2="10.5" stroke="#18110c" stroke-width="1"/>
    <!-- Central Pivot Pin & Horse Pin (Alchemical Center) -->
    <circle cx="12" cy="13.5" r="2.2" fill="#c8983e" stroke="#18110c" stroke-width="1"/>
    <circle cx="12" cy="13.5" r="1.1" fill="#fff5d4"/>
    <circle cx="12" cy="13.5" r="0.5" fill="#18110c"/>
  </g>
</svg>
