<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinco estágios da Esfera</title><style>body{margin:0;color:var(--foreground,#e2e8f0);font-family:var(--font-sans,system-ui)}.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;background:#000;border-radius:8px}figcaption{padding-top:8px;font-size:13px;line-height:1.5}small{display:block;color:var(--muted-foreground,#9a9ca3);font-size:11px}button{font:inherit;background:var(--secondary,#222);color:inherit;border:1px solid var(--border,#555);border-radius:6px;padding:7px 12px;cursor:pointer}.detail{margin:20px auto 0;max-width:420px}.detail img{width:100%}.toolbar{display:flex;justify-content:center;gap:12px;margin-top:14px}@media(max-width:500px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}} </style><div class="stages"><figure><img src="01-nucleo.png" alt="Núcleo" data-stage="0" tabindex="0" role="button"><figcaption>1. Núcleo<small>Globo gravado, sem estrutura externa.</small></figcaption></figure><figure><img src="02-meridiano.png" alt="Meridiano" data-stage="1" tabindex="0" role="button"><figcaption>2. Meridiano<small>Primeiro aro vertical envolvendo o núcleo.</small></figcaption></figure><figure><img src="03-equador.png" alt="Equador" data-stage="2" tabindex="0" role="button"><figcaption>3. Equador<small>Meridiano e faixa equatorial.</small></figcaption></figure><figure><img src="04-orbitas.png" alt="Órbitas" data-stage="3" tabindex="0" role="button"><figcaption>4. Órbitas<small>Órbita oblíqua e coordenadas celestes.</small></figcaption></figure><figure><img src="05-plenitude-armilar.png" alt="Plenitude Armilar" data-stage="4" tabindex="0" role="button"><figcaption>5. Plenitude Armilar<small>Estrutura armilar completa, com anéis polares.</small></figcaption></figure></div><div class="detail"><img id="focus" src="01-nucleo.png" alt="Núcleo ampliado"></div><div class="toolbar"><button id="prev">← Anterior</button><button id="next">Próximo →</button></div><script>const stages=[{"src":"01-nucleo.png","name":"Núcleo"},{"src":"02-meridiano.png","name":"Meridiano"},{"src":"03-equador.png","name":"Equador"},{"src":"04-orbitas.png","name":"Órbitas"},{"src":"05-plenitude-armilar.png","name":"Plenitude Armilar"}];let current=0;function select(i){current=(i+stages.length)%stages.length;const img=document.getElementById('focus');img.src=stages[current].src;img.alt=stages[current].name+' ampliado'}document.querySelectorAll('[data-stage]').forEach(img=>{img.onclick=()=>select(Number(img.dataset.stage));img.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')select(Number(img.dataset.stage))}});document.getElementById('prev').onclick=()=>select(current-1);document.getElementById('next').onclick=()=>select(current+1)</script></html>
