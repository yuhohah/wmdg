<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Esfera — evoluções híbridas v2</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#e9dfc7);font:14px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto}.reference{display:flex;align-items:center;gap:18px;background:#100f0c;color:#c8bea7;border:1px solid #55462b;border-radius:12px;padding:16px;margin-bottom:14px}.reference img{width:104px;height:104px;image-rendering:pixelated;flex-shrink:0}.reference h2{font:600 20px/1.4 Georgia,serif;color:#e7c77d;margin:0 0 6px}.reference p{margin:0;font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}.toolbar .label{margin-right:auto;color:var(--muted-foreground,#a99e89)}button{font:inherit;cursor:pointer;border:1px solid #806a3a;background:#16130e;color:#e9d293;padding:7px 12px;border-radius:6px}button[aria-pressed=true]{background:#3b301a;border-color:#cfad65}button:focus-visible{outline:2px solid #e3c67e;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{margin:0;background:#100f0c;color:#e8dfca;border:1px solid #55462b;border-radius:12px;padding:18px}.art{display:grid;place-items:center;background:#080a0c;border:1px solid #302c22;border-radius:8px;aspect-ratio:1;overflow:hidden}.art img{width:100%;max-width:320px;image-rendering:pixelated}.paper .art{background:#e8e1ce}.card h2{font:600 18px/1.4 Georgia,serif;color:#e7c77d;margin:3px 0 6px}.card p{font-size:13px;color:#bdb39c;margin:0}.number{display:block;font:11px/1.5 ui-monospace,monospace;letter-spacing:2px;color:#a18b56;margin-top:13px}.caption{color:var(--muted-foreground,#9f9580);font-size:12px;margin:12px 0}.reference small{font:11px/1.5 ui-monospace,monospace;letter-spacing:1px;color:#a18b56}.bases .card{border-color:#777267}.bases .number{color:#b3b0a0}@media(min-width:950px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:480px){.grid{gap:9px}.card{padding:12px}.card h2{font-size:15px}.card p{font-size:12px}.reference{gap:12px;padding:12px}.reference img{width:80px;height:80px}.reference h2{font-size:17px}.toolbar .label{flex-basis:100%}}</style></head><body><main>
<section class="reference"><img src="../../sprites/esfera/layers/still.png" alt="Arte atual da Esfera no jogo" width="256" height="256"><div><small>REFERÊNCIA DE IDENTIDADE · ARTE ATUAL</small><h2>Esfera atual do jogo</h2><p>As bases anteriores se misturam aos aros gravados, à trama prateada e aos detalhes dourados do jogo.</p></div></section>
<div class="toolbar"><span class="label" id="view-label">Nova série · fusão com o jogo</span><button id="bases" aria-pressed="false">Bases</button><button id="fusion" aria-pressed="true">Fusão com o jogo</button><button id="paper" aria-pressed="false">Pergaminho</button></div>
<div class="grid"><figure class="card"><div class="art"><img id="stage-0" src="01-centelha-sagrada.png" alt="Centelha Sagrada — fusão com a Esfera atual" width="256" height="256"></div><figcaption><span class="number">EVOLUÇÃO 01</span><h2>Centelha Sagrada</h2><p>O volume da esfera original recebe o núcleo claro e uma borda gravada discreta.</p></figcaption></figure>
<figure class="card"><div class="art"><img id="stage-1" src="02-despertar-ritual.png" alt="Despertar Ritual — fusão com a Esfera atual" width="256" height="256"></div><figcaption><span class="number">EVOLUÇÃO 02</span><h2>Despertar Ritual</h2><p>O primeiro anel vira uma faixa alquímica; núcleo e meridianos aproximam a forma do jogo.</p></figcaption></figure>
<figure class="card"><div class="art"><img id="stage-2" src="03-convergencia-hermetica.png" alt="Convergência Hermética — fusão com a Esfera atual" width="256" height="256"></div><figcaption><span class="number">EVOLUÇÃO 03</span><h2>Convergência Hermética</h2><p>Prata gravada, órbitas cruzadas e estrutura mais vazada revelam o mecanismo celeste.</p></figcaption></figure>
<figure class="card"><div class="art"><img id="stage-3" src="04-plenitude-divina.png" alt="Plenitude Divina — fusão com a Esfera atual" width="256" height="256"></div><figcaption><span class="number">EVOLUÇÃO 04</span><h2>Plenitude Divina</h2><p>A armilar completa encontra os selos, a trama prateada e a faixa dourada da Esfera atual.</p></figcaption></figure></div><p class="caption">PixelLab Pro · PNG transparente · 256 × 256 por conceito · série v2 · use os botões para comparar.</p>
</main><script>
const stages=[{"name": "Centelha Sagrada", "base": "../esfera-evolucoes-v1/01-centelha.png", "file": "01-centelha-sagrada.png"}, {"name": "Despertar Ritual", "base": "../esfera-evolucoes-v1/02-despertar.png", "file": "02-despertar-ritual.png"}, {"name": "Convergência Hermética", "base": "../esfera-evolucoes-v1/03-convergencia.png", "file": "03-convergencia-hermetica.png"}, {"name": "Plenitude Divina", "base": "../esfera-evolucoes-v1/04-plenitude-armilar.png", "file": "04-plenitude-divina.png"}];
function showBases(bases){document.documentElement.classList.toggle('bases',bases);document.getElementById('bases').setAttribute('aria-pressed',String(bases));document.getElementById('fusion').setAttribute('aria-pressed',String(!bases));document.getElementById('view-label').textContent=bases?'Bases anteriores · série v1':'Nova série · fusão com o jogo';stages.forEach((s,i)=>{const im=document.getElementById('stage-'+i);im.src=bases?s.base:s.file;im.alt=(bases?'Base anterior de ':'Nova fusão de ')+s.name;});}
document.getElementById('bases').onclick=()=>showBases(true);document.getElementById('fusion').onclick=()=>showBases(false);document.getElementById('paper').onclick=()=>{const enabled=document.documentElement.classList.toggle('paper');document.getElementById('paper').setAttribute('aria-pressed',String(enabled));};
</script></body></html>
