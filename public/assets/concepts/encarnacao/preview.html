<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans),sans-serif}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stage{background:#0d0c0a;border:1px solid #4c3f26;border-radius:var(--radius);padding:16px;color:#e2dac5;text-align:center;cursor:zoom-in;font:inherit}.stage:hover{border-color:#b99b56}.stage img{width:192px;height:192px;max-width:100%;object-fit:contain;image-rendering:pixelated}.number{font:11px var(--font-mono),monospace;color:#b99b56;margin-bottom:10px}h3{font:16px Georgia,serif;color:#d2b66d;margin:12px 0 8px}p{font-size:11px;line-height:1.5;margin:0;color:#b8b0a0}.note{font-size:12px;color:var(--muted-foreground);margin:12px 0}dialog{background:#0d0c0a;border:1px solid #b99b56;border-radius:12px;padding:24px;color:#e2dac5;text-align:center;max-width:95%}dialog::backdrop{background:#000b}dialog img{width:384px;height:384px;max-width:100%;object-fit:contain;image-rendering:pixelated}dialog button{display:block;margin:12px auto 0;background:#252015;border:1px solid #b99b56;color:#e2dac5;padding:8px 18px;border-radius:6px;cursor:pointer}@media(max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stage{padding:16px 8px}.stage img{width:160px;height:160px}h3{font-size:14px}}</style><div class="grid"><button class="stage" aria-label="Ampliar Avatar Neófito"><div class="number">ESTÁGIO 1</div><img src="01-neofito.png" alt="Avatar Neófito"><h3>Avatar Neófito</h3><p>A Centelha Primordial</p></button><button class="stage" aria-label="Ampliar Avatar Consagrado"><div class="number">ESTÁGIO 2</div><img src="02-consagrado.png" alt="Avatar Consagrado"><h3>Avatar Consagrado</h3><p>O Portador do Fogo Sagrado</p></button><button class="stage" aria-label="Ampliar Avatar Ancestral"><div class="number">ESTÁGIO 3</div><img src="03-ancestral.png" alt="Avatar Ancestral"><h3>Avatar Ancestral</h3><p>O Ancião da Esfera</p></button><button class="stage" aria-label="Ampliar Avatar do Eclipse"><div class="number">ESTÁGIO 4</div><img src="04-eclipse.png" alt="Avatar do Eclipse"><h3>Avatar do Eclipse</h3><p>O Senhor das Sombras Cósmicas</p></button><button class="stage" aria-label="Ampliar Avatar Solar"><div class="number">ESTÁGIO 5</div><img src="05-solar.png" alt="Avatar Solar"><h3>Avatar Solar</h3><p>A Entidade da Luz Eterna</p></button></div><p class="note">1–2: vestes simples, sem auréola · 3: auréola · 4–5: auréola e círculo posterior.<br>Conceitos base · PNG 128 × 128 · fundo transparente · clique para ampliar</p><dialog><img id="large" alt=""><h3 id="title"></h3><button id="close">Fechar</button></dialog><script>const d=document.querySelector('dialog');document.querySelectorAll('.stage').forEach(b=>b.onclick=()=>{const i=b.querySelector('img');document.getElementById('large').src=i.src;document.getElementById('large').alt=i.alt;document.getElementById('title').textContent=i.alt;d.showModal()});document.getElementById('close').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};</script></html>
