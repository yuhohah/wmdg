<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans),sans-serif}.controls{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:12px;color:var(--muted-foreground)}button,select{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);padding:7px 12px;border-radius:6px;cursor:pointer}.stage{background:#090a0f;border:1px solid #4c3f26;border-radius:var(--radius);padding:24px;text-align:center}canvas{width:100%;max-width:512px;height:auto;display:block;margin:auto;image-rendering:pixelated}p{font-size:12px;line-height:1.6;color:var(--muted-foreground);margin:12px 0}</style><div class="controls"><button id="pause">Pausar</button><label>Velocidade <select id="speed"><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><div class="stage"><canvas width="384" height="384" aria-label="Esfera sem pontas, com três anéis girando independentemente"></canvas></div><p>Sem pontas · núcleo parado · anéis independentes<br>Aro externo: 24 s ↻ · anéis internos: 12 s, 16 s e 20 s ↺</p><img hidden id="globe" src="globe.png"><img hidden id="ring-3" src="ring-3.png"><img hidden id="ring-2" src="ring-2.png"><img hidden id="ring-1" src="ring-1.png"><img hidden id="outer" src="outer.png"><script>const defs=[{"id":"globe","periodMs":0,"phase":0,"pivotX":128,"pivotY":128},{"id":"ring-3","periodMs":-20000,"phase":2.0943951023931953,"pivotX":130,"pivotY":131},{"id":"ring-2","periodMs":-16000,"phase":1.0471975511965976,"pivotX":130,"pivotY":131},{"id":"ring-1","periodMs":-12000,"phase":0,"pivotX":130,"pivotY":131},{"id":"outer","periodMs":24000,"phase":0,"pivotX":128,"pivotY":128}],ctx=document.querySelector('canvas').getContext('2d'),pause=document.getElementById('pause');let time=0,last=performance.now(),paused=false,next=0;const angle=l=>l.phase+(l.periodMs?(time%Math.abs(l.periodMs))/l.periodMs*Math.PI*2:0);function layer(l,half){const im=document.getElementById(l.id);if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.translate(192,192);ctx.rotate(angle(l));if(half){ctx.beginPath();ctx.rect(-128,half==='back'?-128:0,256,128);ctx.clip()}ctx.drawImage(im,-l.pivotX,-l.pivotY,256,256);ctx.restore()}function draw(){ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,384,384);defs.slice(1,4).forEach(l=>layer(l,'back'));layer(defs[0]);defs.slice(1,4).forEach(l=>layer(l,'front'));layer(defs[4])}pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Continuar':'Pausar';last=performance.now()};function tick(now){const delta=now-last;last=now;if(!paused)time=(time+delta*+document.getElementById('speed').value)%240000;if(now>=next){next=now+1000/30;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
