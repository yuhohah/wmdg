<!DOCTYPE html><html lang="pt-BR"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans),sans-serif;color:var(--foreground)}.controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}button,select{font:inherit;font-size:12px;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:6px;padding:7px 12px;cursor:pointer}label{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}.stage{padding:24px;background:#090a0f;border:1px solid #4c3f26;border-radius:var(--radius);text-align:center}canvas{display:block;width:100%;max-width:512px;height:auto;margin:0 auto;image-rendering:pixelated}.note{font-size:12px;line-height:1.6;color:var(--muted-foreground);margin:12px 0}.timeline{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--muted-foreground)}input{flex:1;min-width:0}output{font-family:var(--font-mono),monospace;min-width:54px;text-align:right}</style><div class="controls"><button id="play">Pausar</button><button id="next">Próximo quadro</button><label>Velocidade <select id="speed"><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><div class="stage"><canvas width="384" height="384" aria-label="Esfera animada: aro externo horário e anéis internos anti-horários"></canvas></div><div class="timeline"><input id="frame" type="range" min="0" max="63" value="0" aria-label="Quadro da animação"><output id="number">01 / 64</output></div><p class="note">Aro externo ↻ horário · anéis internos ↺ anti-horário · núcleo parado<br>64 quadros · ciclo de 5,12 s · folha PNG transparente em grade 8 × 8</p><img hidden id="sheet" src="spritesheet.png"><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d'),img=document.getElementById('sheet'),range=document.getElementById('frame'),out=document.getElementById('number'),play=document.getElementById('play');let paused=false,timeline=0,last=performance.now(),index=0;function paint(){if(!img.complete||!img.naturalWidth)return;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,384,384);ctx.drawImage(img,(index%8)*384,Math.floor(index/8)*384,384,384,0,0,384,384);range.value=index;out.textContent=String(index+1).padStart(2,'0')+' / 64'}function pause(){paused=true;play.textContent='Continuar'}play.onclick=()=>{paused=!paused;play.textContent=paused?'Continuar':'Pausar';last=performance.now()};document.getElementById('next').onclick=()=>{pause();index=(index+1)%64;timeline=index*80;paint()};range.oninput=()=>{pause();index=+range.value;timeline=index*80;paint()};img.onload=()=>{console.log('Spritesheet: '+img.naturalWidth+' × '+img.naturalHeight);paint()};let nextDraw=0;function tick(now){const delta=now-last;last=now;if(!paused){timeline=(timeline+delta*+document.getElementById('speed').value)%5120;index=Math.floor(timeline/80);if(now>=nextDraw){nextDraw=now+1000/30;paint()}}requestAnimationFrame(tick)}paint();requestAnimationFrame(tick);</script></html>
