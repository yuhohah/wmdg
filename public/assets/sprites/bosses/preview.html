<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>
body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#e6ddc5)}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}button,select{font:inherit;color:inherit;background:var(--secondary,#29251d);border:1px solid var(--border,#635333);border-radius:6px;padding:7px 10px}.scrub{width:120px;vertical-align:middle}main{display:grid;gap:12px}section{padding:16px;background:#0d0b09;border:1px solid #514124;border-radius:var(--radius,8px);color:#e8dcbe}h3{margin:0 0 10px;font-size:17px}.motions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}figure{margin:0;min-width:0;text-align:center}canvas{display:block;width:100%;margin:auto;image-rendering:pixelated;aspect-ratio:4/3}figcaption{color:#b9ac8d;font-size:12px;margin-top:7px}.status{font-size:12px;color:var(--muted-foreground,#aaa);line-height:1.5}body.mirrored canvas{transform:scaleX(-1)}@media(max-width:480px){.motions{grid-template-columns:1fr}canvas{max-width:320px}section{padding:16px}}
</style><div class="controls"><button id="play">Pausar</button><label>Velocidade <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label><button id="flip">Virar para esquerda</button><label>Frame <input class="scrub" id="scrub" type="range" min="0" max="16" value="0"></label></div><div style="display:none"><img id="01-anubis-andar" src="./lateral/01-anubis/andar/spritesheet.png" alt=""><img id="01-anubis-ataque-bastao" src="./lateral/01-anubis/ataque-bastao/spritesheet.png" alt=""><img id="01-anubis-ataque-balanca" src="./lateral/01-anubis/ataque-balanca/spritesheet.png" alt=""><img id="02-hades-andar" src="./lateral/02-hades/andar/spritesheet.png" alt=""><img id="02-hades-ataque-duplo" src="./lateral/02-hades/ataque-duplo/spritesheet.png" alt=""><img id="02-hades-ataque-correntes" src="./lateral/02-hades/ataque-correntes/spritesheet.png" alt=""><img id="03-odin-andar" src="./lateral/03-odin/andar/spritesheet.png" alt=""><img id="03-odin-ataque-lanca" src="./lateral/03-odin/ataque-lanca/spritesheet.png" alt=""><img id="03-odin-ataque-corvo" src="./lateral/03-odin/ataque-corvo/spritesheet.png" alt=""><img id="04-caos-primordial-andar" src="./lateral/04-caos-primordial/andar/spritesheet.png" alt=""><img id="04-caos-primordial-ataque-esferas" src="./lateral/04-caos-primordial/ataque-esferas/spritesheet.png" alt=""><img id="04-caos-primordial-ataque-circulos" src="./lateral/04-caos-primordial/ataque-circulos/spritesheet.png" alt=""></div><main><section><h3>Anúbis</h3><div class="motions"><figure><canvas width="256" height="192" data-boss="01-anubis" data-action="andar"></canvas><figcaption>Andar</figcaption></figure><figure><canvas width="256" height="192" data-boss="01-anubis" data-action="ataque-bastao"></canvas><figcaption>Bastão</figcaption></figure><figure><canvas width="256" height="192" data-boss="01-anubis" data-action="ataque-balanca"></canvas><figcaption>Balança</figcaption></figure></div></section><section><h3>Hades</h3><div class="motions"><figure><canvas width="256" height="192" data-boss="02-hades" data-action="andar"></canvas><figcaption>Andar</figcaption></figure><figure><canvas width="256" height="192" data-boss="02-hades" data-action="ataque-duplo"></canvas><figcaption>Golpe duplo</figcaption></figure><figure><canvas width="256" height="192" data-boss="02-hades" data-action="ataque-correntes"></canvas><figcaption>Chicote de correntes</figcaption></figure></div></section><section><h3>Odin</h3><div class="motions"><figure><canvas width="256" height="192" data-boss="03-odin" data-action="andar"></canvas><figcaption>Andar</figcaption></figure><figure><canvas width="256" height="192" data-boss="03-odin" data-action="ataque-lanca"></canvas><figcaption>Lança</figcaption></figure><figure><canvas width="256" height="192" data-boss="03-odin" data-action="ataque-corvo"></canvas><figcaption>Corvo</figcaption></figure></div></section><section><h3>Caos Primordial</h3><div class="motions"><figure><canvas width="256" height="192" data-boss="04-caos-primordial" data-action="andar"></canvas><figcaption>Levitar</figcaption></figure><figure><canvas width="256" height="192" data-boss="04-caos-primordial" data-action="ataque-esferas"></canvas><figcaption>Esferas</figcaption></figure><figure><canvas width="256" height="192" data-boss="04-caos-primordial" data-action="ataque-circulos"></canvas><figcaption>Círculos</figcaption></figure></div></section></main><p class="status" id="status">Carregando 12 animações laterais…</p><script>
let paused=false,speed=1,elapsed=0,last=0,loaded=0,manual=null;
function draw(p,frame){if(!p.image.complete||!p.image.naturalWidth||p.frame===frame)return;p.frame=frame;p.ctx.clearRect(0,0,256,192);p.ctx.drawImage(p.image,frame*256,0,256,192,0,0,256,192)}
const players=Array.from(document.querySelectorAll('canvas')).map(canvas=>{
const image=document.getElementById(canvas.dataset.boss+'-'+canvas.dataset.action),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const p={canvas,image,ctx,count:17,frame:-1,ready:false};
image.onload=()=>{if(p.ready)return;p.ready=true;p.count=image.width/256;loaded++;document.getElementById('status').textContent=loaded===12?'12 animações · perfil lateral · 256 × 192 px · PNG transparente. Os ataques repetem nesta prévia.':'Carregadas '+loaded+' de 12 animações';draw(p,0)};
image.onerror=()=>document.getElementById('status').textContent='Falha: '+canvas.dataset.boss+' / '+canvas.dataset.action;
if(image.complete&&image.naturalWidth)image.onload();return p});
function tick(now){if(last&&now-last<1000/30){requestAnimationFrame(tick);return}const dt=last?Math.min(now-last,100):0;last=now;if(!paused)elapsed+=dt*speed;for(const p of players){const attack=p.canvas.dataset.action!=='andar';const cycle=p.count*90+(attack?650:0);const frame=manual===null?Math.min(p.count-1,Math.floor((elapsed%cycle)/90)):Math.min(manual,p.count-1);draw(p,frame)}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.getElementById('play').onclick=e=>{paused=!paused;manual=null;e.target.textContent=paused?'Reproduzir':'Pausar'};
document.getElementById('speed').onchange=e=>speed=Number(e.target.value);
document.getElementById('flip').onclick=e=>{const yes=document.body.classList.toggle('mirrored');e.target.textContent=yes?'Virar para direita':'Virar para esquerda'};
document.getElementById('scrub').oninput=e=>{manual=Number(e.target.value);paused=true;document.getElementById('play').textContent='Reproduzir';for(const p of players)draw(p,Math.min(manual,p.count-1))};
</script></html>
