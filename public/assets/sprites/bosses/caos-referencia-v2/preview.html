<!doctype html><html lang="pt-BR"><meta charset="utf-8"><style>body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#e6ddc5)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}button,select{font:inherit;color:inherit;background:var(--secondary,#29251d);border:1px solid var(--border,#635333);border-radius:6px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}figure{margin:0;padding:16px;background:#0d0b09;border:1px solid #594727;border-radius:var(--radius,8px);text-align:center;color:#e8dcbe}canvas{width:100%;aspect-ratio:4/3;display:block;image-rendering:pixelated}figcaption{margin-top:12px;font-size:14px}.status{font-size:12px;color:var(--muted-foreground,#aaa);line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}canvas{max-width:384px;margin:auto}}</style><div class="controls"><button id="play">Pausar</button><label>Velocidade <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label><label>Frame <input id="scrub" type="range" min="0" max="16" value="0"></label></div><div style="display:none"><img id="img-andar" src="./andar/spritesheet.png" alt=""><img id="img-ataque-esferas" src="./ataque-esferas/spritesheet.png" alt=""><img id="img-ataque-circulos" src="./ataque-circulos/spritesheet.png" alt=""></div><div class="grid"><figure><canvas width="256" height="192" data-key="andar"></canvas><figcaption>Levitar</figcaption></figure><figure><canvas width="256" height="192" data-key="ataque-esferas"></canvas><figcaption>Esferas</figcaption></figure><figure><canvas width="256" height="192" data-key="ataque-circulos"></canvas><figcaption>Círculos</figcaption></figure></div><p class="status" id="status">Carregando…</p><script>let paused=false,speed=1,elapsed=0,last=0,manual=null,loaded=0;function draw(p,f){if(!p.ready||p.frame===f)return;p.frame=f;p.ctx.clearRect(0,0,256,192);p.ctx.drawImage(p.image,f*256,0,256,192,0,0,256,192)}
const players=Array.from(document.querySelectorAll('canvas')).map(canvas=>{const image=document.getElementById('img-'+canvas.dataset.key),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const p={canvas,image,ctx,count:17,ready:false,frame:-1};image.onload=()=>{if(p.ready)return;p.ready=true;p.count=image.width/256;loaded++;document.getElementById('status').textContent=loaded===3?'Caos Primordial · referência preservada · 256 × 192 px · fundo transparente. Ataques repetidos nesta prévia.':'Carregadas '+loaded+' de 3 animações';draw(p,0)};image.onerror=()=>document.getElementById('status').textContent='Falha ao carregar '+canvas.dataset.key;if(image.complete&&image.naturalWidth)image.onload();return p});
function tick(t){if(last&&t-last<1000/30){requestAnimationFrame(tick);return}const dt=last?Math.min(t-last,100):0;last=t;if(!paused)elapsed+=dt*speed;for(const p of players){const cycle=p.count*90+(p.canvas.dataset.key==='andar'?0:600);draw(p,manual===null?Math.min(p.count-1,Math.floor(elapsed%cycle/90)):Math.min(p.count-1,manual))}requestAnimationFrame(tick)}requestAnimationFrame(tick);document.getElementById('play').onclick=e=>{paused=!paused;manual=null;e.target.textContent=paused?'Reproduzir':'Pausar'};document.getElementById('speed').onchange=e=>speed=Number(e.target.value);document.getElementById('scrub').oninput=e=>{manual=Number(e.target.value);paused=true;document.getElementById('play').textContent='Reproduzir';players.forEach(p=>draw(p,Math.min(p.count-1,manual)))};
</script></html>
