<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derrotas dos Guardiões · PixelLab</title>
<style>body{margin:0;background:#141216;color:#e1d5bf;font:18px Georgia,serif;padding:28px}main{max-width:1100px;margin:auto}h1{font-weight:normal;font-size:30px}p{color:#b6aa94;line-height:1.5}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(256px,1fr));gap:16px}article{background:#1b181c;border:1px solid #55482e;padding:18px;text-align:center}h2{font-weight:normal;font-size:23px}canvas{width:100%;max-width:384px;image-rendering:pixelated}button{border:1px solid #b68d48;background:#28221b;color:#e5d3aa;padding:12px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e5d3aa;outline-offset:3px}</style>
<main><h1>Derrotas dos Guardiões</h1><p>Quatro animações criadas no PixelLab a partir dos sprites do jogo. Cada sequência toca uma vez em 1,5 segundo; depois o chefe desaparece e os Fiéis retornam.</p><button id="repeat">Repetir todas</button><section id="previews"></section></main>
<script type="module">
const manifest=await(await fetch('derrotas-manifest.json')).json();const players=[];
for(const a of manifest.animations){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=a.name;const canvas=document.createElement('canvas');canvas.width=256;canvas.height=192;canvas.setAttribute('aria-label',`Animação de derrota de ${a.name}`);const button=document.createElement('button');button.textContent='Repetir';card.append(title,canvas,button);document.getElementById('previews').append(card);const image=new Image();image.src=a.sheet;await image.decode();const player={a,image,ctx:canvas.getContext('2d'),start:performance.now(),next:0};player.ctx.imageSmoothingEnabled=false;button.onclick=()=>{player.start=performance.now();player.next=0};players.push(player);}
document.getElementById('repeat').onclick=()=>players.forEach(p=>{p.start=performance.now();p.next=0});
function tick(now){for(const p of players){if(now<p.next)continue;p.next=now+1000/30;const t=Math.min(1,Math.max(0,(now-p.start)/p.a.durationMs));const frame=Math.min(16,Math.floor(t*17));p.ctx.clearRect(0,0,256,192);p.ctx.globalAlpha=Math.min(1,(1-t)/.1);p.ctx.drawImage(p.image,frame*256,0,256,192,0,0,256,192);}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
